name: Ally
options:
  bundleIdPrefix: com.keerthia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  Ally:
    type: application
    platform: iOS
    sources:
      - path: Ally
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # An (empty) generated launch screen opts into native full-screen rendering
        # on every device; without it iOS letterboxes the app at a legacy resolution.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.keerthia.Ally
        SUPPORTED_DESTINATIONS: "iphone"
        SWIFT_VERSION: "5.9"
        # Toolkit's Color Blindness Simulator can pull from camera or photo library.
        INFOPLIST_KEY_NSCameraUsageDescription: "Ally uses the camera to preview how your design looks through different types of color blindness."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ally reads a screenshot you choose so it can simulate color blindness on it."

  AllyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AllyTests
    dependencies:
      - target: Ally
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keerthia.AllyTests
        SWIFT_VERSION: "5.9"

  AllyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AllyUITests
    dependencies:
      - target: Ally
    settings:
      base:
        TEST_TARGET_NAME: Ally
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.keerthia.AllyUITests
        SWIFT_VERSION: "5.9"

schemes:
  Ally:
    build:
      targets:
        Ally: all
        AllyTests: [test]
        AllyUITests: [test]
    test:
      targets:
        - AllyTests
        - AllyUITests
